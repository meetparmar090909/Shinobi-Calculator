<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Sage Mode Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Particles -->
    <div class="chakra-particle" style="left: 10%; width: 10px; height: 10px; animation-delay: 0s;"></div>
    <div class="chakra-particle" style="left: 30%; width: 15px; height: 15px; animation-delay: 2s;"></div>
    <div class="chakra-particle" style="left: 70%; width: 8px; height: 8px; animation-delay: 4s;"></div>
    <div class="chakra-particle" style="left: 90%; width: 12px; height: 12px; animation-delay: 1s;"></div>

    <main class="app-shell">
        <section class="hero-copy" aria-label="Naruto calculator theme">
            <div class="badge">Hidden Leaf Math Tool</div>
            <h1>Naruto<br>Calculator</h1>
            <p>Fast chakra-style calculations with a scroll panel, glowing display, and shinobi button controls.</p>
            <div class="stats-row">
                <div class="stat">
                    <strong>Sage Mode</strong>
                    <span>active display</span>
                </div>
                <div class="stat">
                    <strong>Rasengan</strong>
                    <span>tap effects</span>
                </div>
                <div class="stat">
                    <strong>Konoha</strong>
                    <span>anime UI</span>
                </div>
            </div>
        </section>

        <div class="calculator">
            <div class="calculator-top">
                <div class="header">
                    <h1>SHINOBI CALC</h1>
                </div>
                <div class="leaf-symbol" aria-hidden="true">忍</div>
            </div>

            <div class="display">
                <div class="previous-operand"></div>
                <div class="current-operand">0</div>
            </div>

            <div class="buttons-grid">
                <button id="btn-ac" class="span-two all-clear">AC</button>
                <button id="btn-del" class="all-clear">DEL</button>
                <button id="btn-divide" class="operator">÷</button>

                <button id="btn-7" class="number">7</button>
                <button id="btn-8" class="number">8</button>
                <button id="btn-9" class="number">9</button>
                <button id="btn-multiply" class="operator">×</button>

                <button id="btn-4" class="number">4</button>
                <button id="btn-5" class="number">5</button>
                <button id="btn-6" class="number">6</button>
                <button id="btn-add" class="operator">+</button>

                <button id="btn-1" class="number">1</button>
                <button id="btn-2" class="number">2</button>
                <button id="btn-3" class="number">3</button>
                <button id="btn-subtract" class="operator">-</button>

                <button id="btn-dot" class="number">.</button>
                <button id="btn-0" class="number">0</button>
                <button id="btn-equals" class="span-two equals">BELIEVE IT!</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
